<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapitre 6 — Exercice listes (liens et images)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 720px; margin: 24px auto; }
        img { object-fit: cover; background: #e7e9eb; }
    </style>
</head>
<body>
    <h1>Menu de liens (ul + li + a)</h1>
    <ul>
        <li><a href="https://www.google.com">Google</a></li>
        <li><a href="https://www.facebook.com">Facebook</a></li>
        <li><a href="https://www.twitter.com">Twitter</a></li>
        <li><a href="https://www.instagram.com">Instagram</a></li>
        <li><a href="https://www.linkedin.com">Linkedin</a></li>
    </ul>

    <h1>Galerie numérotée (ol + li + img)</h1>
    <ol>
        <li><img src="images/image.png" alt="Annonce 1" width="100" height="100"></li>
        <li><img src="images/image2.png" alt="Annonce 2" width="100" height="100"></li>
        <li><img src="images/image3.png" alt="Annonce 3" width="100" height="100"></li>
        <li><img src="images/image4.png" alt="Annonce 4" width="100" height="100"></li>
        <li><img src="images/image5.png" alt="Annonce 5" width="100" height="100"></li>
    </ol>
</body>
</html>

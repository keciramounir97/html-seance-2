<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Séance HTML — Annonces Alger</title>
    <link rel="shortcut icon" href="icones/html.png" type="image/x-icon">
    <style>
        body { font-family: Arial, sans-serif; max-width: 720px; margin: 24px auto; }
        .hint { background: #fff3cd; padding: 12px 16px; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Regarde l'onglet du navigateur</h1>
    <p class="hint">
        Le titre de cette page dans l'onglet est défini par <b>&lt;title&gt;</b>.
        La petite icône vient du <b>favicon</b> (fichier dans le dossier icones/).
        Le <b>h1</b> ci-dessus est dans le body : ce n'est pas le texte de l'onglet.
    </p>
</body>
</html>
